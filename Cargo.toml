[package]
name = "strat-forward"
version = "1.0.0"
edition = "2021"
description = "2D forward stratigraphic model: accommodation, conservative sediment transport, compaction, flexural isostasy, event record"
license = "MIT"
repository = "https://github.com/kylejones200/strat-forward"
# File::try_lock (output directory lock).
rust-version = "1.89"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# OpenLineage run ids, dataset versions and the HTTP transport.
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
ureq = "2"
# Atomic exchange of the output directory (renamex_np / renameat2).
libc = "0.2"

[[bin]]
name = "strat-forward"
path = "src/main.rs"

[dev-dependencies]
# Test-only: validates OpenLineage events against the official schemas.
jsonschema = "0.33"
